<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investment suite -- Client Hub</title>
<meta name="robots" content="noindex">
<!-- The notes now open inside the Investment suite page, one file each under
     /hub/suite/notes/. Old links (?note=<slug>) land on the same note. -->
<script>
(function () {
  var note = new URLSearchParams(location.search).get('note');
  location.replace('/hub/suite/index.html' + (note ? '?note=' + encodeURIComponent(note) : ''));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/hub/suite/index.html"></noscript>
</head>
<body>
<p><a href="/hub/suite/index.html">Go to the Investment suite</a></p>
</body>
</html>
