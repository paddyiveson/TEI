<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEI Education -- The Everyday Investor</title>
<link rel="stylesheet" href="/hub/education/css/tei-tokens.css">
<style>
  .home-hero { max-width: 760px; margin: 0 auto; padding: 56px 24px 8px; text-align: center; }
  .home-hero .label { display: block; text-align: center; border: none; }
  .home-hero h1 { font-size: 34px; }
  .home-wrap { max-width: 900px; margin: 0 auto; padding: 24px 24px 90px; }
  .stage-block { margin-top: 44px; }
  .stage-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .stage-head .stage-num { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 22px; color: var(--navy); }
  .stage-head .stage-name { font-size: 13px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold); font-weight: 600; }
  .mod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .mod-grid { grid-template-columns: 1fr; } }
  .mod-card { background: #fff; border: 1px solid var(--cream-dark); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; text-decoration: none; display: block; transition: border-color .15s, box-shadow .15s; }
  .mod-card:hover { border-color: var(--gold); box-shadow: 0 3px 10px rgba(29,53,87,0.1); }
  .mod-card .mod-num { font-size: 11px; color: var(--navy-mid); font-weight: 600; letter-spacing: 0.05em; margin-bottom: 6px; }
  .mod-card h3 { margin-bottom: 8px; }
  .mod-card .mod-purpose { font-size: 13.5px; color: var(--ink-soft); line-height: 1.55; margin-bottom: 14px; }
  .mod-card .mod-meta { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--navy-mid); }
  .mod-card .mod-meta .go { color: var(--gold); font-weight: 600; }
  .home-footnote { text-align: center; font-size: 12.5px; color: var(--ink-soft); margin-top: 56px; }
</style>
</head>
<body>
<div class="shell">
  <header class="tei-header" id="header"></header>
  <div class="home-hero">
    <p class="label">The Everyday Investor</p>
    <h1>Learn to invest, at your own pace.</h1>
    <p class="lede">A grounded, honest introduction to money and investing -- built to give you real understanding before any real decision, not a shortcut past it.</p>
  </div>
  <main class="home-wrap" id="stages">
    <p style="text-align:center;color:var(--ink-soft);">Loading...</p>
  </main>
  <p class="home-footnote">More stages are on the way. Your progress is saved automatically as you go.</p>
</div>

<script src="/hub/education/js/embedded-data.js"></script>
<script src="/hub/education/js/content-store.js"></script>
<script src="/hub/education/js/completion-store.js"></script>
<script src="/hub/education/js/shell.js"></script>
<script>
  renderHeader(document.getElementById("header"), []);

  ContentStore.listModules().then(async (mods) => {
    const built = mods.filter((m) => m.lessonSequence.length);
    const clientId = CompletionStore.getCurrentClientId();
    const byStage = {};
    for (const m of built) {
      (byStage[m.stage] = byStage[m.stage] || []).push(m);
    }

    const stageBlocks = await Promise.all(
      Object.keys(byStage).sort((a, b) => a - b).map(async (stageNum) => {
        const modsInStage = byStage[stageNum];
        const cards = await Promise.all(
          modsInStage.map(async (m) => {
            const complete = await CompletionStore.isModuleComplete(clientId, m.id, ContentStore);
            return `
              <a class="mod-card" href="/hub/education/module.html?module=${m.id}">
                <div class="mod-num">${m.id}</div>
                <h3>${m.name}</h3>
                <p class="mod-purpose">${m.purpose || ""}</p>
                <div class="mod-meta">
                  <span>${m.lessonSequence.length} lessons</span>
                  <span class="go">${complete ? "Completed" : "Start"} &#8594;</span>
                </div>
              </a>
            `;
          })
        );
        return `
          <div class="stage-block">
            <div class="stage-head">
              <span class="stage-num">Stage ${stageNum}</span>
              <span class="stage-name">${modsInStage[0].stageName || ""}</span>
            </div>
            <div class="mod-grid">${cards.join("")}</div>
          </div>
        `;
      })
    );

    document.getElementById("stages").innerHTML = stageBlocks.join("");
  });
</script>
</body>
</html>
