<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Library -- Client Hub</title>
<meta name="description" content="Reference material behind the TEI curriculum.">
<script src="/hub/js/tei-theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub/css/hub-tokens.css">
<link rel="stylesheet" href="/hub/css/hub-shell.css">
<link rel="stylesheet" href="/hub/css/knowledge.css">

<body>
<script src="/hub/js/supabase-config.js"></script>
<script src="/hub/js/supabase-client.js"></script>
<script src="/hub/js/hub-gate.js"></script>

<div data-hub-header data-current="library"></div>
<script src="/hub/js/hub-header.js"></script>

<main class="hb kl" data-kl="index">
  <div class="kl-head">
    <p class="hb-kicker mono">Library</p>
    <h1 class="hb-title">Articles and reference, in one place.</h1>
    <p class="kl-line">Our articles on money and investing, then nine libraries of terms, quotes, models, books, investors, events, companies, papers and frameworks.</p>
  </div>

  <label class="hb-search kl-find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span class="sr">Search articles and every library</span><input id="klAll" type="search" placeholder="Search articles and libraries" autocomplete="off"></label>

  <div class="kl-results" id="klResults" hidden></div>
  <!-- Articles first, then the nine reference libraries (8a, Paddy 2 Nov 2026). -->
  <section class="kl-arts" id="klArts" aria-labelledby="klArtsH" hidden></section>
  <header class="kl-sh" id="klRefH"><h2>Reference</h2><p>Nine libraries, each mapped to the modules you learn in.</p></header>
  <div class="kl-libs" id="klLibs"><p class="kl-empty">Loading the Library.</p></div>

  <div class="hb-foot" data-tei-boundary-footer="inherit"></div>
</main>

<!-- One script for the index and every library; content in /hub/knowledge/data/. -->
<script src="/hub/knowledge/kl.js" defer></script>
</body>
</html>
