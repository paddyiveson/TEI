<!doctype html><html><head><meta charset="utf-8">
<!-- Own-style thumbnail: the same words-only layout as thumb.html, dressed in
     the article's own colours and type from sets/<slug>.own.css (Paddy, 10 Nov
     2026: ONDS and NBIS keep their own look, alongside the TEI on-brand set).
     Headline, company name, kicker and date only. -->
<style>
@font-face{font-family:Sora;font-weight:800;src:url(fonts/sora-latin-800-normal.woff2)}
@font-face{font-family:Manrope;font-weight:500;src:url(fonts/manrope-latin-500-normal.woff2)}
@font-face{font-family:Manrope;font-weight:700;src:url(fonts/manrope-latin-700-normal.woff2)}
@font-face{font-family:Geist;font-weight:400;src:url(fonts/geist-sans-latin-400-normal.woff2)}
@font-face{font-family:Geist;font-weight:500;src:url(fonts/geist-sans-latin-500-normal.woff2)}
@font-face{font-family:"Geist Mono";font-weight:500;src:url(fonts/geist-mono-latin-500-normal.woff2)}
*{box-sizing:border-box;margin:0}
.card{position:relative;overflow:hidden;width:var(--w);height:var(--h);padding:var(--pad);display:grid;grid-template-rows:auto 1fr auto;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);font-family:var(--body)}
.card::before{content:"";position:absolute;inset:0;background:var(--glow,none)}
.card>*{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--s)*.6);font-size:var(--s);color:var(--muted)}
.brand{display:flex;align-items:center;gap:calc(var(--s)*.45);font-weight:var(--brand-w,500)}
.brand svg{width:calc(var(--s)*1.15);height:calc(var(--s)*1.15)}
.pills{display:flex;gap:calc(var(--s)*.4)}
.pill{font-size:calc(var(--s)*.8);padding:calc(var(--s)*.32) calc(var(--s)*.75);border-radius:999px}
.mid{align-self:center;display:grid;gap:calc(var(--s)*1.1)}
h1{font-family:var(--display);font-weight:var(--h1-w);font-size:calc(var(--h1) * var(--k,1));line-height:var(--h1-lh,1.06);letter-spacing:var(--h1-ls,-.03em);max-width:var(--mw,15ch)}
.dek{font-size:calc(var(--s)*1.2);color:var(--muted);max-width:42ch}
.co{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:calc(var(--s)*.9);border-bottom:1px solid var(--line)}
.co .who{display:flex;align-items:center;gap:calc(var(--s)*.7)}
.co .who i{width:calc(var(--s)*.7);height:calc(var(--s)*.7);border-radius:50%;background:var(--accent)}
.co .who b{font-family:var(--tick-font,inherit);font-weight:700;font-size:calc(var(--s)*1.05);letter-spacing:.04em}
.co .who span,.co .dt{font-size:calc(var(--s)*1.0);color:var(--muted)}
</style>
<style>__THEME__</style>
</head><body>
<div class="card __CLS__" style="__VARS__">
  <div class="top"><div class="brand">__MARK__The Everyday Investor</div><div class="pills">__PILLS__</div></div>
  <div class="mid">
    <h1>__H1__</h1>
    __DEK__
  </div>
  <div class="co"><div class="who"><i></i><b>__TICKER__</b><span>__NAME__</span></div><div class="dt">__DATE__</div></div>
</div>
</body></html>
