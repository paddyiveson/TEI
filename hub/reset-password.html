<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Client Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
body { margin: 0; font-family: 'Inter', sans-serif; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #C9A84C; outline-offset: 3px; }
.reset-wrap {
  min-height: 100vh;
  background: linear-gradient(160deg, #1D3557 0%, #0f1e3a 100%);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.reset-card { max-width: 380px; width: 100%; text-align: center; }
.reset-mark {
  width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #C9A84C;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  color: #C9A84C; margin: 0 auto 24px;
}
.reset-title { font-family: 'Playfair Display', serif; font-size: 24px; color: #F7F4ED; margin-bottom: 10px; }
.reset-sub { font-size: 13px; color: rgba(247,244,237,.55); margin-bottom: 28px; line-height: 1.7; }
.reset-field {
  width: 100%; padding: 13px 16px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06); color: #F7F4ED; font-size: 14px; font-family: 'Inter', sans-serif;
  margin-bottom: 12px; outline: none; box-sizing: border-box;
}
.reset-btn {
  width: 100%; padding: 13px; border-radius: 8px; border: none; background: #C9A84C;
  color: #1D3557; font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer;
}
.reset-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.reset-error { font-size: 12px; color: #e07a6f; margin-top: 14px; display: none; }
.reset-msg { font-size: 12px; color: #8fd4a0; margin-top: 14px; display: none; }
.reset-back { font-size: 12px; margin-top: 18px; }
.reset-back a { color: #C9A84C; text-decoration: none; }
</style>
</head>
<body>
<div class="reset-wrap">
  <div class="reset-card">
    <div class="reset-mark">&#10022;</div>
    <p class="reset-title">Set a new password</p>
    <p class="reset-sub" id="resetSub">Choose a new password for your Client Hub account.</p>
    <form id="resetForm" style="display:none;">
      <input type="password" id="newPassword" class="reset-field" placeholder="New password" required minlength="8" autocomplete="new-password">
      <input type="password" id="confirmPassword" class="reset-field" placeholder="Confirm password" required minlength="8" autocomplete="new-password">
      <button type="submit" class="reset-btn" id="submitBtn">Update password</button>
    </form>
    <p class="reset-error" id="resetError"></p>
    <p class="reset-msg" id="resetMsg"></p>
    <p class="reset-back"><a href="/hub/login.html">Back to sign in</a></p>
  </div>
</div>

<script src="/hub/js/supabase-config.js"></script>
<script src="/hub/js/supabase-client.js"></script>
<script>
(function () {
  var form = document.getElementById("resetForm");
  var sub = document.getElementById("resetSub");

  function showError(msg) {
    var el = document.getElementById("resetError");
    el.textContent = msg;
    el.style.display = "block";
    document.getElementById("resetMsg").style.display = "none";
  }

  function showMsg(msg) {
    var el = document.getElementById("resetMsg");
    el.textContent = msg;
    el.style.display = "block";
    document.getElementById("resetError").style.display = "none";
  }

  function showResetForm() {
    form.style.display = "block";
  }

  // PKCE (?code=) and legacy hash (#access_token) recovery flows.
  TeiAuth.finishAuthCallback().then(function (exchangeResult) {
    if (exchangeResult.error) {
      showError(exchangeResult.error.message);
      sub.textContent = "This reset link is invalid or has expired.";
      return null;
    }
    return TeiAuth.waitForReady();
  }).then(function (client) {
    if (!client) return;

    return new Promise(function (resolve) {
      var settled = false;

      function settle(ok) {
        if (settled) return;
        settled = true;
        resolve(ok);
      }

      client.auth.onAuthStateChange(function (event) {
        if (event === "PASSWORD_RECOVERY") settle(true);
      });

      client.auth.getSession().then(function (result) {
        if (result.data.session) settle(true);
      });

      setTimeout(function () {
        settle(false);
      }, 4000);
    });
  }).then(function (hasSession) {
    if (hasSession) {
      showResetForm();
      return;
    }
    sub.textContent = "This reset link is invalid or has expired. Request a new one from the sign-in page.";
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = document.getElementById("newPassword").value;
    var confirm = document.getElementById("confirmPassword").value;
    if (pw !== confirm) {
      showError("Passwords do not match.");
      return;
    }
    if (pw.length < 8) {
      showError("Password must be at least 8 characters.");
      return;
    }
    var btn = document.getElementById("submitBtn");
    btn.disabled = true;
    TeiAuth.updatePassword(pw).then(function (result) {
      if (result.error) {
        showError(result.error.message);
        btn.disabled = false;
        return;
      }
      showMsg("Password updated. Redirecting to sign in…");
      setTimeout(function () {
        window.location.href = "/hub/login.html";
      }, 1500);
    });
  });
})();
</script>
</body>
</html>
