<script>
/* Safety net: a Supabase password-recovery link can land here instead of
   /hub/reset-password.html if the project's Site URL falls back to the
   site root. Forward the code/token on immediately so the reset form still
   works. Mirrors redirectRecoveryCallbackIfNeeded() in hub/js/supabase-client.js. */
(function () {
  var search = window.location.search || "";
  var hash = window.location.hash || "";
  var params = new URLSearchParams(search);
  var isRecovery = params.get("type") === "recovery" || hash.indexOf("type=recovery") !== -1;
  var hasAuthPayload = params.has("code") || hash.indexOf("access_token=") !== -1;
  if (hasAuthPayload || isRecovery) {
    window.location.replace("/hub/reset-password.html" + search + hash);
  }
})();
</script>
<div id="hubGate" style="position:fixed;inset:0;z-index:5000;background:linear-gradient(160deg,#1D3557 0%,#0f1e3a 100%);display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="max-width:380px;width:100%;text-align:center;">
    <div style="width:44px;height:44px;border-radius:50%;border:1.5px solid #C9A84C;display:flex;align-items:center;justify-content:center;font-size:20px;color:#C9A84C;margin:0 auto 24px;">&#10022;</div>
    <p style="font-family:'Playfair Display',serif;font-size:24px;color:#F7F4ED;margin-bottom:10px;">Client Hub</p>
    <p style="font-size:13px;color:rgba(247,244,237,.55);margin-bottom:28px;line-height:1.7;">This area is for TEI clients. Enter the password you were given to continue.</p>
    <div style="position:relative;">
      <input type="password" id="hubGatePw" placeholder="Password" style="width:100%;padding:13px 44px 13px 16px;border-radius:8px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#F7F4ED;font-size:14px;font-family:'Inter',sans-serif;text-align:center;margin-bottom:14px;outline:none;box-sizing:border-box;">
      <button type="button" onclick="toggleHubGatePw(this)" aria-label="Show password" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(247,244,237,.5);cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button onclick="hubGateCheck()" style="width:100%;padding:13px;border-radius:8px;border:none;background:#C9A84C;color:#1D3557;font-size:14px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;">Enter</button>
    <p id="hubGateError" style="font-size:12px;color:#e07a6f;margin-top:14px;display:none;">That password isn't right. Try again.</p>
  </div>
</div>
<script>
(function() {
  var HUB_PASSWORD = "TEI";
  if (sessionStorage.getItem("hubUnlocked") === "yes") {
    var gate = document.getElementById("hubGate");
    if (gate) gate.style.display = "none";
  }
})();
var HUB_GATE_PW_EYE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
var HUB_GATE_PW_EYE_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 1 12s4 7 11 7a10.94 10.94 0 0 0 5.39-1.61"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function toggleHubGatePw(btn) {
  var input = document.getElementById("hubGatePw");
  var showing = input.type === "text";
  input.type = showing ? "password" : "text";
  btn.innerHTML = showing ? HUB_GATE_PW_EYE : HUB_GATE_PW_EYE_OFF;
  btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
}
function hubGateCheck() {
  var input = document.getElementById("hubGatePw");
  var error = document.getElementById("hubGateError");
  if (input.value === "TEI") {
    sessionStorage.setItem("hubUnlocked", "yes");
    document.getElementById("hubGate").style.display = "none";
  } else {
    error.style.display = "block";
    input.value = "";
    input.focus();
  }
}
document.addEventListener("DOMContentLoaded", function() {
  var input = document.getElementById("hubGatePw");
  if (input) {
    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") hubGateCheck();
    });
  }
});
</script>
