<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Guides and tools -- Client Hub</title>
<script src="/hub/js/tei-theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub/css/hub-tokens.css">
<link rel="stylesheet" href="/hub/css/hub-shell.css">
<link rel="stylesheet" href="/assets/guides-tools.css">
<link rel="stylesheet" href="/hub/css/guides-tools-hub.css">
</head>
<body>
<script src="/hub/js/supabase-config.js"></script>
<script src="/hub/js/supabase-client.js"></script>
<script src="/hub/js/hub-gate.js"></script>

<div data-hub-header data-current="guides"></div>
<script src="/hub/js/hub-header.js"></script>

<main class="hb gt" data-gt-mode="hub">

<!-- The same page as the public Guides & Tools (/guides.html), with the
     members' finish: /hub/css/guides-tools-hub.css. Cards come from
     /assets/guides-tools.json via /assets/guides-tools.js. -->
<section class="gt-hero">
<div class="gt-hero-glow t-glow" aria-hidden="true"></div>
<div class="gt-hero-ring t-s90" aria-hidden="true"></div>
<div class="gt-hero-in">
<h1 class="gt-hero-h t-up">Understand it first. <span>Then run the numbers.</span></h1>
<div class="gt-find t-up2">
<label class="gt-search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><span class="gt-sr">Search guides and tools</span><input id="gt-search" class="gt-search" type="search" placeholder="Search, e.g. ISA, pension, property" autocomplete="off"></label>
</div>
</div>
</section>

<!-- Members band: the tools only members get -->
<section class="gt-sec gt-band" id="gt-members-sec" aria-labelledby="gt-members-h">
<header class="gt-sh"><div><p class="gt-k">Members only</p><h2 id="gt-members-h">Included in your membership</h2></div></header>
<div class="gt-g" id="gt-members"></div>
</section>

<section class="gt-sec gt-lib-sec" id="gt-lib-sec" aria-labelledby="gt-count">
<header class="gt-sh">
<h2 id="gt-count" class="gt-sr" aria-live="polite">Guides and tools</h2>
<div class="gt-kinds" id="gt-kinds" role="group" aria-label="Show"><button type="button" class="gt-kind" data-v="All" aria-pressed="true">All</button><button type="button" class="gt-kind" data-v="Guides" aria-pressed="false">Guides</button><button type="button" class="gt-kind" data-v="Tools" aria-pressed="false">Tools</button></div>
</header>
<div class="gt-g" id="gt-lib"></div>
<p class="gt-empty" id="gt-empty" hidden>Nothing matches. Try another word or clear the search.</p>
</section>

<section class="gt-sec gt-soon" id="gt-soon" aria-labelledby="gt-soon-k">
<p class="gt-k" id="gt-soon-k">Coming soon</p>
<ul class="gt-soon-l" id="gt-soon-l"></ul>
</section>

<div class="hb-foot" data-tei-boundary-footer="inherit"></div>
</main>


<script src="/assets/tei-art.js" defer></script>
<script src="/assets/guides-tools.js" defer></script>
</body>
</html>
