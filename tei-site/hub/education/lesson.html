<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson -- The Everyday Investor</title>
<link rel="stylesheet" href="/hub/education/css/tei-tokens.css">
</head>
<body>
<div class="shell">
  <header class="tei-header" id="header"></header>
  <div class="layout">
    <aside class="tei-sidebar" id="sidebar"></aside>
    <main class="tei-main" id="app"><p style="color:var(--ink-soft);">Loading lesson...</p></main>
  </div>
</div>

<script src="/hub/education/js/embedded-data.js"></script>
<script src="/hub/education/js/content-store.js"></script>
<script src="/hub/education/js/completion-store.js"></script>
<script src="/hub/education/js/lesson-session.js"></script>
<script src="/hub/education/js/shell.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const lessonId = params.get("lesson") || "2.1.1";
  const app = document.getElementById("app");

  Promise.all([ContentStore.getModuleForLesson(lessonId), ContentStore.getLesson(lessonId)]).then(([mod, lesson]) => {
    renderHeader(document.getElementById("header"), mod ? [
      { label: `Stage ${mod.stage}` },
      { label: mod.name, href: `/hub/education/module.html?module=${mod.id}` },
      { label: lesson ? lesson.title : lessonId },
    ] : []);
    renderSidebar(document.getElementById("sidebar"), mod ? mod.id : null, lessonId);
  });

  mountLessonSession(app, lessonId);
</script>
</body>
</html>
