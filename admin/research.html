<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research — TEI Cortex</title>
<link rel="stylesheet" href="/admin/css/admin-tokens.css">
</head>
<body>
<div class="shell">
  <header class="admin-header" id="adminHeader"></header>
  <main class="admin-main">
    <div class="placeholder-page">
      <div class="placeholder-icon">🔎</div>
      <h1>Research</h1>
      <p>Not connected yet. The 12 TEI Research notes already exist in hub/suite.html but haven't been linked into Cortex — this page is where that connection lands once it's built, alongside document-derived research.</p>
      <p><a href="/admin/investments.html">Go to Investment Intelligence →</a></p>
    </div>
  </main>
</div>

<script src="/hub/js/supabase-config.js"></script>
<script src="/hub/js/supabase-client.js"></script>
<script src="/admin/js/admin-auth.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script>
(function () {
  TeiAdminAuth.requireAdviser().then(function (profile) {
    if (!profile) return;
    renderAdminHeader(document.getElementById('adminHeader'), 'research');
  }).catch(function (err) {
    console.error(err);
    document.body.innerHTML =
      '<pre style="padding:40px;font-family:monospace;white-space:pre-wrap;color:#b3453f;max-width:900px;">' +
      'Something went wrong loading this page:\n\n' + (err && (err.stack || err.message) || err) +
      '</pre>';
  });
})();
</script>
</body>
</html>
