<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Historical Market Events -- Library -- Client Hub</title>
<meta name="description" content="From Tulip Mania to the AI investment cycle: what happened, how investors behaved and what it teaches.">
<script src="/hub/js/tei-theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub/css/hub-tokens.css">
<link rel="stylesheet" href="/hub/css/hub-shell.css">
<link rel="stylesheet" href="/hub/css/knowledge.css">
</head>
<body>
<script src="/hub/js/supabase-config.js"></script>
<script src="/hub/js/supabase-client.js"></script>
<script src="/hub/js/hub-gate.js"></script>

<div data-hub-header data-current="library"></div>
<script src="/hub/js/hub-header.js"></script>

<main class="hb kl" data-kl="historical-market-events">
  <div class="kl-head">
    <a class="kl-back mono" href="/hub/knowledge/index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Library</a>
    <h1 class="hb-title">Historical Market Events</h1>
    <p class="kl-line"><span class="kl-count mono" id="klCount"></span><span id="klLine">From Tulip Mania to the AI investment cycle: what happened, how investors behaved and what it teaches.</span></p>
  </div>

  <div class="kl-bar" id="klBar">
    <label class="hb-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span class="sr">Search the Historical Market Events</span><input id="klSearch" type="search" placeholder="Search the historical market events" autocomplete="off"></label>
    <span class="kl-sel"><label class="sr" for="klMod">Curriculum module</label><select id="klMod"><option value="">All modules</option></select></span>
    <span class="kl-sel"><label class="sr" for="klTheme">Theme</label><select id="klTheme"><option value="">All themes</option></select></span>
    <button type="button" class="kl-clear" id="klClear" hidden>Clear filters</button>
  </div>
  <div class="kl-types" id="klTypes" role="group" aria-label="Category" hidden></div>
  <p class="kl-result mono" id="klResult" aria-live="polite"></p>

  <div class="kl-list" id="klList"><p class="kl-empty">Loading the historical market events.</p></div>
  <div class="kl-morebox"><button type="button" class="kl-more" id="klMore" hidden>Show more</button></div>

  <div class="hb-foot" data-tei-boundary-footer="inherit"></div>
</main>

<!-- One script for the index and every library; content in /hub/knowledge/data/. -->
<script src="/hub/knowledge/kl.js" defer></script>
</body>
</html>
