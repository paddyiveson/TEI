<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Context — TEI Cortex</title>
<link rel="stylesheet" href="/admin/css/admin-tokens.css">
</head>
<body>
<div class="shell">
  <header class="admin-header" id="adminHeader"></header>
  <main class="admin-main">
    <p class="eyebrow">TEI Cortex</p>
    <h1>Client Context</h1>
    <p style="color:var(--ink-soft); font-size:14px; margin-bottom:24px;">
      A narrow, read-mostly reference for your own thinking — TEI coaching clients only.
      Never a match score, never a "relevant investments" list. Supports your judgement; never outputs one.
    </p>

    <ul class="client-list" id="clientList">
      <li class="pipeline-empty">Loading…</li>
    </ul>
  </main>
</div>

<script src="/hub/js/supabase-config.js"></script>
<script src="/hub/js/supabase-client.js"></script>
<script src="/admin/js/admin-auth.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/cortex-client.js"></script>
<script src="/admin/js/clients.js"></script>
<script>
(function () {
  TeiAdminAuth.requireAdviser({
    onDenied: function () {
      document.getElementById('clientList').innerHTML =
        '<li class="pipeline-empty">Your account doesn\'t have adviser access.</li>';
    }
  }).then(function (profile) {
    if (!profile) return;
    renderAdminHeader(document.getElementById('adminHeader'), 'clients');
    ClientsController.init(window.teiSupabase);
  }).catch(function (err) {
    console.error(err);
    document.body.innerHTML =
      '<pre style="padding:40px;font-family:monospace;white-space:pre-wrap;color:#b3453f;max-width:900px;">' +
      'Something went wrong loading this page:\n\n' + (err && (err.stack || err.message) || err) +
      '</pre>';
  });
})();
</script>
</body>
</html>
