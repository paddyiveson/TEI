<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Client Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
body { margin: 0; font-family: 'Inter', sans-serif; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #C9A84C; outline-offset: 3px; }
.login-wrap {
  min-height: 100vh;
  background: linear-gradient(160deg, #1D3557 0%, #0f1e3a 100%);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.login-card { max-width: 380px; width: 100%; text-align: center; }
.login-mark {
  width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #C9A84C;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  color: #C9A84C; margin: 0 auto 24px;
}
.login-title { font-family: 'Playfair Display', serif; font-size: 24px; color: #F7F4ED; margin-bottom: 10px; }
.login-sub { font-size: 13px; color: rgba(247,244,237,.55); margin-bottom: 28px; line-height: 1.7; }
.login-field {
  width: 100%; padding: 13px 16px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06); color: #F7F4ED; font-size: 14px; font-family: 'Inter', sans-serif;
  margin-bottom: 12px; outline: none; box-sizing: border-box;
}
.login-btn {
  width: 100%; padding: 13px; border-radius: 8px; border: none; background: #C9A84C;
  color: #1D3557; font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer;
  margin-top: 4px;
}
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
/* Overlay the toggle on the field with CSS Grid (both share grid-area 1/1,
   align-items:center centers each within the shared row) rather than
   position:absolute + top:50%/translateY(-50%) -- functionally equivalent
   in theory, but the absolute+transform version kept rendering with visibly
   more space above the icon than below (reported live, on a confirmed-
   fresh deploy -- not a caching issue). Grid overlay is the more robust,
   more commonly-used pattern for exactly this "icon inside a field" case,
   so switching to it rather than continuing to guess at the transform
   approach's cause. */
.pw-wrap { display: grid; align-items: center; }
.pw-wrap .login-field { grid-area: 1/1; padding-right: 44px; }
.pw-toggle {
  grid-area: 1/1; justify-self: end; margin-right: 8px;
  width: 28px; height: 28px; background: none; border: none;
  color: rgba(247,244,237,.5); cursor: pointer; padding: 0; line-height: 0;
  display: flex; align-items: center; justify-content: center;
  appearance: none; -webkit-appearance: none;
}
.pw-toggle svg { display: block; flex: none; }
.pw-toggle:hover { color: rgba(247,244,237,.85); }
.login-error { font-size: 12px; color: #e07a6f; margin-top: 14px; display: none; }
.login-forgot { font-size: 12px; color: rgba(247,244,237,.45); margin-top: 18px; }
.login-forgot a { color: #C9A84C; text-decoration: none; }
.login-forgot a:hover { text-decoration: underline; }
.login-msg { font-size: 12px; color: #8fd4a0; margin-top: 14px; display: none; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark">&#10022;</div>
    <p class="login-title">Client Hub</p>
    <p class="login-sub">This area is for TEI clients. Sign in with the email and password you were given. Contact TEI if you need access.</p>
    <form id="loginForm">
      <input type="email" id="email" class="login-field" placeholder="Email" required autocomplete="email">
      <div class="pw-wrap">
        <input type="password" id="password" class="login-field" placeholder="Password" required autocomplete="current-password">
        <button type="button" class="pw-toggle" onclick="toggleShowPassword('password', this)" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <button type="submit" class="login-btn" id="submitBtn">Sign in</button>
    </form>
    <p class="login-error" id="loginError"></p>
    <p class="login-msg" id="loginMsg"></p>
    <p class="login-forgot"><a href="#" id="forgotLink">Forgot password?</a></p>
  </div>
</div>

<script src="/hub/js/supabase-config.js"></script>
<script src="/hub/js/supabase-client.js"></script>
<script>
// Shared by every password field on this page (just the one here, but the
// same function name/behaviour as the other login/reset/gate pages).
var PW_EYE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
var PW_EYE_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 1 12s4 7 11 7a10.94 10.94 0 0 0 5.39-1.61"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function toggleShowPassword(fieldId, btn) {
  var el = document.getElementById(fieldId);
  var showing = el.type === "text";
  el.type = showing ? "password" : "text";
  btn.innerHTML = showing ? PW_EYE : PW_EYE_OFF;
  btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
}

(function () {
  var params = new URLSearchParams(window.location.search);
  var redirectTo = params.get("redirect") || "/hub/index.html";

  function showError(msg) {
    var el = document.getElementById("loginError");
    el.textContent = msg;
    el.style.display = "block";
    document.getElementById("loginMsg").style.display = "none";
  }

  function showMsg(msg) {
    var el = document.getElementById("loginMsg");
    el.textContent = msg;
    el.style.display = "block";
    document.getElementById("loginError").style.display = "none";
  }

  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = document.getElementById("submitBtn");
    btn.disabled = true;
    document.getElementById("loginError").style.display = "none";

    TeiAuth.signIn(
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    ).then(function (result) {
      if (result.error) {
        showError(result.error.message || "Sign in failed. Check your email and password.");
        btn.disabled = false;
        return;
      }
      window.location.href = redirectTo;
    }).catch(function () {
      showError("Something went wrong. Please try again.");
      btn.disabled = false;
    });
  });

  document.getElementById("forgotLink").addEventListener("click", function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim();
    if (!email) {
      showError("Enter your email above, then click Forgot password.");
      return;
    }
    TeiAuth.resetPassword(email).then(function (result) {
      if (result.error) {
        var msg = result.error.message || "Could not send reset email.";
        if (/rate limit/i.test(msg)) {
          msg += " Wait about an hour, or ask TEI to set your password directly.";
        }
        showError(msg);
        return;
      }
      showMsg("Check your email for a password reset link.");
    });
  });
})();
</script>
</body>
</html>
