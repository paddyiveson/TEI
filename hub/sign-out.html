<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Signing out · Client Hub</title>
<!-- Sign out from anywhere on the site (QA Sweep 1, 30 Oct 2026). Public pages
     do not load the sign-in library, so their Sign out links come here: the
     session ends, then the sign-in page. Without JavaScript the session cannot
     be ended, so say so. -->
<script src="/hub/js/tei-theme.js"></script>
<link rel="stylesheet" href="/hub/css/hub-tokens.css">
<link rel="stylesheet" href="/hub/css/hub-sign-out.css">
</head>
<body>
<main class="so-main">
  <p class="so-msg" role="status">Signing you out&hellip;</p>
  <noscript><p class="so-msg">Signing out needs JavaScript. <a href="/hub/login.html">Back to sign in</a></p></noscript>
</main>
<script src="/hub/js/supabase-config.js"></script>
<script src="/hub/js/supabase-client.js"></script>
<script>
(function () {
  function go() { location.replace('/hub/login.html'); }
  if (window.TeiAuth && TeiAuth.signOut) TeiAuth.signOut().then(go, go); else go();
})();
</script>
</body>
</html>
