<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module -- The Everyday Investor</title>
<link rel="stylesheet" href="/hub/education/css/tei-tokens.css">
</head>
<body>
<div class="shell">
  <header class="tei-header" id="header"></header>
  <div class="layout">
    <aside class="tei-sidebar" id="sidebar"></aside>
    <main class="tei-main" id="app"><p style="color:var(--ink-soft);">Loading module...</p></main>
  </div>
</div>

<script src="/hub/education/js/embedded-data.js"></script>
<script src="/hub/education/js/content-store.js"></script>
<script src="/hub/education/js/completion-store.js"></script>
<script src="/hub/education/js/module-entry.js"></script>
<script src="/hub/education/js/shell.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const moduleId = params.get("module") || "1.1";
  const app = document.getElementById("app");

  ContentStore.getModule(moduleId).then((mod) => {
    renderHeader(document.getElementById("header"), mod ? [
      { label: `Stage ${mod.stage}` },
      { label: mod.name },
    ] : []);
  });
  renderSidebar(document.getElementById("sidebar"), moduleId, null);
  mountModuleEntry(app, moduleId);
</script>
</body>
</html>
