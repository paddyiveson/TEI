<header class="hb-bar">
  <div class="hb-bar-in">
    <a class="hb-brand" href="/hub/index.html"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="var(--gold)" stroke-width="1.4"/><circle cx="13" cy="13" r="6" fill="none" stroke="var(--gold)" stroke-opacity=".5" stroke-width="1.2"/><circle cx="13" cy="13" r="2.4" fill="var(--gold)"/></svg>Client Hub</a>
    <nav class="hb-nav" aria-label="Client Hub">
      <a href="/hub/index.html">Home</a>

      <a class="hb-open" href="/hub/wealth-os.html">Open Wealth OS</a>
    </nav>
  </div>
</header>

<main class="hb kl" data-kl="research-papers">
  <div class="kl-head">
    <a class="kl-back mono" href="/hub/knowledge/index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Knowledge library</a>
    <h1 class="hb-title">Research Papers</h1>
    <p class="kl-line"><span class="kl-count mono" id="klCount"></span><span id="klLine">The research behind our evidence base: the question, the findings and what they mean for investors.</span></p>
  </div>

  <div class="kl-bar" id="klBar">
    <label class="hb-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span class="sr">Search the Research Papers</span><input id="klSearch" type="search" placeholder="Search the research papers" autocomplete="off"></label>
    <span class="kl-sel"><label class="sr" for="klMod">Curriculum module</label><select id="klMod"><option value="">All modules</option></select></span>
    <span class="kl-sel"><label class="sr" for="klTheme">Theme</label><select id="klTheme"><option value="">All themes</option></select></span>
    <button type="button" class="kl-clear" id="klClear" hidden>Clear filters</button>
  </div>
  <div class="kl-types" id="klTypes" role="group" aria-label="Category" hidden></div>
  <p class="kl-result mono" id="klResult" aria-live="polite"></p>

  <div class="kl-list" id="klList"><p class="kl-empty">Loading the research papers.</p></div>
  <div class="kl-morebox"><button type="button" class="kl-more" id="klMore" hidden>Show more</button></div>

  <div class="hb-foot" data-tei-boundary-footer="inherit"></div>
</main>

<!-- One script for the index and every library; content in /hub/knowledge/data/. -->
<script src="/hub/knowledge/kl.js" defer></script>
<!-- Phones: the shared website and Client Hub bar (assets/mobile-nav.js). -->
<link rel="stylesheet" href="/assets/mobile-nav.css">
<script src="/assets/mobile-nav.js" defer></script>
