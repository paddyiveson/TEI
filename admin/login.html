<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Adviser</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
body { margin: 0; font-family: 'Inter', sans-serif; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #C9A84C; outline-offset: 3px; }
.login-wrap {
  min-height: 100vh;
  background: linear-gradient(160deg, #1D3557 0%, #0f1e3a 100%);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.login-card { max-width: 380px; width: 100%; text-align: center; }
.login-mark {
  width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #C9A84C;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  color: #C9A84C; margin: 0 auto 24px;
}
.login-title { font-family: 'Playfair Display', serif; font-size: 24px; color: #F7F4ED; margin-bottom: 10px; }
.login-sub { font-size: 13px; color: rgba(247,244,237,.55); margin-bottom: 28px; line-height: 1.7; }
.login-field {
  width: 100%; padding: 13px 16px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06); color: #F7F4ED; font-size: 14px; font-family: 'Inter', sans-serif;
  margin-bottom: 12px; outline: none; box-sizing: border-box;
}
.login-btn {
  width: 100%; padding: 13px; border-radius: 8px; border: none; background: #C9A84C;
  color: #1D3557; font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer;
  margin-top: 4px;
}
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
/* Grid overlay, not position:absolute+transform -- see hub/login.html's
   copy of this comment for why. */
.pw-wrap { display: grid; align-items: center; }
.pw-wrap .login-field { grid-area: 1/1; padding-right: 44px; }
.pw-toggle {
  grid-area: 1/1; justify-self: end; margin-right: 8px;
  width: 28px; height: 28px; background: none; border: none;
  color: rgba(247,244,237,.5); cursor: pointer; padding: 0; line-height: 0;
  display: flex; align-items: center; justify-content: center;
  appearance: none; -webkit-appearance: none;
}
.pw-toggle svg { display: block; flex: none; }
.pw-toggle:hover { color: rgba(247,244,237,.85); }
.login-error { font-size: 12px; color: #e07a6f; margin-top: 14px; display: none; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark">&#10022;</div>
    <p class="login-title">Adviser</p>
    <p class="login-sub">This area is for TEI advisers only. Sign in with your adviser account.</p>
    <form id="loginForm">
      <input type="email" id="email" class="login-field" placeholder="Email" required autocomplete="email">
      <div class="pw-wrap">
        <input type="password" id="password" class="login-field" placeholder="Password" required autocomplete="current-password">
        <button type="button" class="pw-toggle" onclick="toggleShowPassword('password', this)" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <button type="submit" class="login-btn" id="submitBtn">Sign in</button>
    </form>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<script src="/hub/js/supabase-config.js"></script>
<script src="/hub/js/supabase-client.js"></script>
<script src="/admin/js/admin-auth.js"></script>
<script>
var PW_EYE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
var PW_EYE_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 1 12s4 7 11 7a10.94 10.94 0 0 0 5.39-1.61"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function toggleShowPassword(fieldId, btn) {
  var el = document.getElementById(fieldId);
  var showing = el.type === "text";
  el.type = showing ? "password" : "text";
  btn.innerHTML = showing ? PW_EYE : PW_EYE_OFF;
  btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
}

(function () {
  var params = new URLSearchParams(window.location.search);
  var redirectTo = params.get("redirect") || "/admin/index.html";

  function showError(msg) {
    var el = document.getElementById("loginError");
    el.textContent = msg;
    el.style.display = "block";
  }

  // If already signed in as an adviser, skip the form entirely.
  TeiAdminAuth.isAdviser().then(function (adviser) {
    if (adviser) window.location.href = redirectTo;
  });

  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = document.getElementById("submitBtn");
    btn.disabled = true;
    document.getElementById("loginError").style.display = "none";

    TeiAuth.signIn(
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    ).then(function (result) {
      if (result.error) {
        // Same generic message whether the password was wrong or the
        // account exists but isn't an adviser -- see the role check below.
        showError("Sign in failed. Check your email and password.");
        btn.disabled = false;
        return;
      }
      // Credentials were valid -- now confirm the account actually holds
      // adviser access. A client account that guesses/knows this page's URL
      // must not retain a session here even though their password was correct.
      return TeiAdminAuth.getAdviserProfile().then(function (profile) {
        if (!profile || profile.role !== "adviser") {
          return TeiAuth.signOut().then(function () {
            showError("Sign in failed. Check your email and password.");
            btn.disabled = false;
          });
        }
        window.location.href = redirectTo;
      });
    }).catch(function () {
      showError("Something went wrong. Please try again.");
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
