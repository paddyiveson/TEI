<!DOCTYPE html>

<head>

<title>Portfolio Optimisation Lab — The Everyday Investor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Spectral:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

<!-- Same three auth tags hub/wealth-os.html itself loads (see hub/index.html) -- needed before
     data-wealth-os.js runs so window.teiSupabase / TeiAuth exist. This page is reached via a link
     from Wealth OS's Portfolio page, not embedded inline in that file and not iframed (iframing
     would put window.teiSupabase behind a frame boundary this page's data layer can't see). -->
<script src="/hub/js/supabase-config.js"></script>
<script src="/hub/js/supabase-client.js"></script>
<script src="/hub/js/hub-auth.js"></script>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand">
          <span class="mark">TEI</span>
          <div>
            <h1>Portfolio Optimisation Lab</h1>
          </div>
        </div>
        <div id="portfolio-pill" class="portfolio-pill"></div>
      </div>
      <nav class="stage-nav" id="stage-nav"></nav>
    </div>
  </div>
  <main id="view-root"></main>
</div>

<!-- Wealth OS (live data) variant: reuses the shared calc engine + every render-*.js the
     demo-data build (index.html) uses, but with its own state/portfolio-view/data-layer/boot
     files in place of state.js, render-portfolio.js and app.js. See each file's header comment
     for exactly what it replaces and why -- never load both variants' equivalents on one page. -->
<script src="/portfolio-optimisation-lab/js/state-wealth-os.js"></script>
<script src="/portfolio-optimisation-lab/js/calc-engine.js"></script>
<script src="/portfolio-optimisation-lab/js/components.js"></script>

<script src="/portfolio-optimisation-lab/js/render-portfolio-wealth-os.js"></script>

<script src="/portfolio-optimisation-lab/js/render-optimise.js"></script>
<script src="/portfolio-optimisation-lab/js/render-compare.js"></script>
<script src="/portfolio-optimisation-lab/js/render-implement.js"></script>
<script src="/portfolio-optimisation-lab/js/render-results.js"></script>
<script src="/portfolio-optimisation-lab/js/data-wealth-os.js"></script>
<script src="/portfolio-optimisation-lab/js/app-wealth-os.js"></script>
